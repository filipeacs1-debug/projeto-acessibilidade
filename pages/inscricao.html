<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UNAMA — Inscrição</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<a class="skip-link" href="#conteudo">
    Pular para o conteúdo principal
</a>

<header class="header">

    <div class="container header-content">

        <a href="../index.html" class="logo">
            UNAMA
        </a>

        <nav
            class="main-nav"
            aria-label="Navegação principal"
        >
            <a href="../index.html">Início</a>
            <a href="cursos.html">Cursos</a>
            <a href="login.html">Área do candidato</a>
        </nav>

    </div>

</header>


<main id="conteudo">

    <section class="page-header">

        <div class="container">

            <span class="eyebrow">
                Inscrição
            </span>

            <h1>
                Inscreva-se
            </h1>

            <p>
                Administração — Bacharelado — Presencial
            </p>

        </div>

    </section>


    <section class="content-section">

        <div class="container narrow">

            <form
                id="enrollmentForm"
                class="form-card"
                novalidate
            >

                <h2>
                    Seus dados
                </h2>

                <p>
                    Os campos marcados com * são obrigatórios.
                </p>


                <div class="form-group">

                    <label for="nome">
                        Nome completo *
                    </label>

                    <input
                        type="text"
                        id="nome"
                        autocomplete="name"
                        required
                        aria-describedby="nomeError"
                    >

                    <span
                        id="nomeError"
                        class="field-error"
                        role="alert"
                    ></span>

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail *
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        required
                        aria-describedby="emailError"
                    >

                    <span
                        id="emailError"
                        class="field-error"
                        role="alert"
                    ></span>

                </div>


                <div class="form-group">

                    <label for="telefone">
                        Telefone *
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        autocomplete="tel"
                        required
                        aria-describedby="telefoneError"
                    >

                    <span
                        id="telefoneError"
                        class="field-error"
                        role="alert"
                    ></span>

                </div>


                <button
                    type="submit"
                    class="button button-primary full-width"
                >
                    Confirmar inscrição
                </button>

            </form>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container">
        <strong>UNAMA</strong>
    </div>

</footer>


<script src="../js/script.js"></script>

</body>
</html>
