<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UNAMA — Área do Candidato</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<a class="skip-link" href="#conteudo">
    Pular para o conteúdo principal
</a>

<header class="header">

    <div class="container header-content">

        <a href="../index.html" class="logo">
            UNAMA
        </a>

        <nav
            class="main-nav"
            aria-label="Navegação principal"
        >
            <a href="../index.html">Início</a>
            <a href="cursos.html">Cursos</a>
        </nav>

    </div>

</header>


<main id="conteudo">

    <section class="auth-section">

        <div class="auth-card">

            <span class="eyebrow">
                Área do candidato
            </span>

            <h1>
                Entrar
            </h1>

            <p>
                Acesse sua conta para acompanhar sua inscrição.
            </p>


            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        inputmode="numeric"
                        autocomplete="username"
                        aria-describedby="cpfError"
                        required
                    >

                    <span
                        id="cpfError"
                        class="field-error"
                        role="alert"
                    ></span>

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        autocomplete="current-password"
                        aria-describedby="senhaError"
                        required
                    >

                    <span
                        id="senhaError"
                        class="field-error"
                        role="alert"
                    ></span>

                </div>


                <button
                    type="submit"
                    class="button button-primary full-width"
                >
                    Entrar
                </button>

            </form>


            <div
                id="loginMessage"
                class="status-message"
                role="status"
                aria-live="polite"
            ></div>


            <p class="form-help">
                Protótipo acadêmico: qualquer CPF e senha preenchidos
                podem ser utilizados para testar o fluxo.
            </p>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container">
        <strong>UNAMA</strong>
    </div>

</footer>


<script src="../js/script.js"></script>

</body>
</html>
