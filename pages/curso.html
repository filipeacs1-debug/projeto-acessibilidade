<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Busca de cursos de graduação da UNAMA."
    >

    <title>UNAMA — Cursos</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<a class="skip-link" href="#conteudo">
    Pular para o conteúdo principal
</a>

<header class="header">

    <div class="container header-content">

        <a href="../index.html" class="logo">
            UNAMA
        </a>

        <button
            class="menu-button"
            id="menuButton"
            type="button"
            aria-expanded="false"
            aria-controls="mainMenu"
        >
            <span class="sr-only">Abrir menu</span>
            ☰
        </button>

        <nav
            class="main-nav"
            id="mainMenu"
            aria-label="Navegação principal"
        >
            <a href="../index.html">Início</a>
            <a href="cursos.html" aria-current="page">Cursos</a>
            <a href="../index.html#ingresso">Ingresso</a>
            <a href="../index.html#ajuda">Ajuda</a>
            <a href="login.html" class="nav-login">
                Área do candidato
            </a>
        </nav>

    </div>

</header>


<main id="conteudo">

    <section class="page-header">

        <div class="container">

            <span class="eyebrow">
                Graduação
            </span>

            <h1>
                Encontre seu curso
            </h1>

            <p>
                Utilize os filtros para encontrar o curso ideal.
            </p>

        </div>

    </section>


    <section class="search-section">

        <div class="container">

            <form id="searchForm" class="search-form">

                <div class="form-group">

                    <label for="curso">
                        Curso
                    </label>

                    <input
                        type="search"
                        id="curso"
                        placeholder="Ex.: Administração"
                        autocomplete="off"
                    >

                </div>


                <div class="form-group">

                    <label for="cidade">
                        Cidade
                    </label>

                    <select id="cidade">

                        <option value="">
                            Todas as cidades
                        </option>

                        <option value="Belém">
                            Belém
                        </option>

                        <option value="Manaus">
                            Manaus
                        </option>

                        <option value="Boa Vista">
                            Boa Vista
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="modalidade">
                        Modalidade
                    </label>

                    <select id="modalidade">

                        <option value="">
                            Todas as modalidades
                        </option>

                        <option value="Presencial">
                            Presencial
                        </option>

                        <option value="EAD">
                            EAD
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="button button-primary"
                >
                    Buscar cursos
                </button>

            </form>


            <div
                id="searchStatus"
                class="status-message"
                role="status"
                aria-live="polite"
            ></div>


            <div
                id="results"
                class="results"
                aria-live="polite"
            ></div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container">
        <strong>UNAMA</strong>

        <p>
            Protótipo acadêmico de acessibilidade digital.
        </p>
    </div>

</footer>


<script src="../js/script.js"></script>

</body>
</html>
